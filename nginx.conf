# The dashboard is a single-page application: every unknown path is a route
# the client-side router owns, so it must serve index.html rather than a 404.
#
# This matters for a separated deployment too: the backend redirects browser
# navigation to this frontend, and the paths it redirects to are dashboard
# routes, not files.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The build output is content-hashed, so it can be cached indefinitely.
    #
    # The hashed bundles live under /static, not /assets: the build emits
    # static/js and static/css. A rule written for /assets would never match
    # and the bundles would be revalidated on every load.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached: it names the current hashed bundles,
    # and a stale copy points at bundles that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # A single-page application is driven from the browser, so there is
    # nothing for a server-side render to protect here. The CSP stays
    # permissive about inline styles and scripts because the bundle and the
    # third-party widgets it loads need them.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
