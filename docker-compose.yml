# Frontend deployment - standalone, next to the backend
#
# The dashboard is a static bundle served by nginx. It talks to the backend
# over the network, so the two can live on different hosts, different
# domains, or different containers.
#
# Usage:
#   1. cp .env.example .env   # set VITE_API_BASE_URL to the backend's URL
#   2. docker compose up -d --build
#   3. Put a reverse proxy (nginx / Caddy / Traefik) in front for HTTPS
#
# The API address is baked into the bundle at build time, so changing it
# means rebuilding: `docker compose up -d --build`.

services:
  new-api-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The backend's public URL. Empty means "same origin", which only
        # works when a reverse proxy routes the API paths to the backend on
        # this same host.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_REACT_APP_VERSION: ${VITE_REACT_APP_VERSION:-dev}
    image: new-api-web:latest
    container_name: new-api-web
    restart: unless-stopped
    ports:
      # Bound to loopback on purpose: the container's own nginx speaks plain
      # HTTP, and the TLS termination belongs to the reverse proxy in front
      # of it. Change this only if you terminate TLS here.
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - new-api-web-network

networks:
  new-api-web-network:
    driver: bridge
