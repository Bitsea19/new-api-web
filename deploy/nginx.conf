# Reverse proxy for the separated deployment.
#
# Two server blocks, two domains:
#
#   app.example.com -> the frontend container (nginx serving the static bundle)
#   api.example.com -> the backend container (the Go API server)
#
# The two origins are different, so the browser treats every API call as
# cross-origin. That is expected: the backend's CORS_ALLOWED_ORIGINS has to
# list the frontend's origin exactly, and the session cookie needs
# SESSION_COOKIE_SECURE=true.
#
# Replace every occurrence of app.example.com / api.example.com with your own
# hostnames before using this file.
#
# If both hostnames are subdomains of ONE registrable domain (example.com),
# they are the same site: SESSION_COOKIE_SAME_SITE can stay `strict`.
# If they are two different registrable domains, the cookie needs
# SESSION_COOKIE_SAME_SITE=none, and both sides need HTTPS.

# The `map` directive belongs in the `http` block, not in a `server` block.
# When you drop this file into /etc/nginx/conf.d/, the whole file is already
# inside `http`. When you paste it into a `server` block by hand, move the
# map out to the `http` level first.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The frontend: a static bundle with a single-page-application fallback.
#
# The fallback is mandatory: the dashboard owns its own routes, so any path
# that is not a file must serve index.html rather than a 404.
server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # Everything goes through HTTPS. Uncomment once the certificate exists.
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The bundle is content-hashed, so it can be cached hard.
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, immutable";
    }

    # index.html names the current hashed bundles: a stale copy points at
    # bundles that no longer exist, so it must never be cached.
    location = /index.html {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        add_header Cache-Control "no-cache";
    }
}

# The backend: the API server.
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The backend streams: relay responses and SSE stay open for minutes, and
    # a buffering proxy would hold the whole answer before sending the first
    # byte.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    chunked_transfer_encoding on;

    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
